<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Caetano — Desenvolvedor de Software</title>
  <desc id="description">Banner em tons escuros, roxo e ciano apresentando o portfólio de Rodrigo Caetano.</desc>
  <defs>
    <linearGradient id="background" x1="68" y1="20" x2="1100" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B16"/>
      <stop offset="0.5" stop-color="#11142A"/>
      <stop offset="1" stop-color="#071624"/>
    </linearGradient>
    <linearGradient id="accent" x1="332" y1="117" x2="864" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientTransform="translate(198 58) rotate(41) scale(368 278)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(1080 310) rotate(-151) scale(410 257)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A5B4FC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowPurple)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowCyan)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="2"/>

  <g opacity="0.55">
    <circle cx="74" cy="70" r="4" fill="#A78BFA"/>
    <circle cx="1126" cy="286" r="4" fill="#22D3EE"/>
    <path d="M75 70H177L211 104" stroke="#A78BFA" stroke-opacity="0.4"/>
    <path d="M1022 251L1057 286H1125" stroke="#22D3EE" stroke-opacity="0.4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="486" y="62" width="228" height="34" rx="17" fill="#171A31" stroke="#6D5BD0" stroke-opacity="0.55"/>
    <circle cx="510" cy="79" r="5" fill="#22D3EE"/>
    <text x="526" y="84" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="2">OLÁ, EU SOU</text>
  </g>

  <text x="600" y="169" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">Rodrigo Caetano</text>
  <rect x="344" y="190" width="512" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="239" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5">DESENVOLVEDOR DE SOFTWARE</text>
  <text x="600" y="290" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">Transformando ideias em experiências digitais.</text>
</svg>
